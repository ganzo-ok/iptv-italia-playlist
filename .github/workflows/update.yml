name: Aggiorna Playlist IPTV

on:
  schedule:
    # Ogni giorno alle 03:00 UTC (04:00/05:00 in Italia)
    - cron: "0 3 * * *"
  workflow_dispatch:  # Permette l'esecuzione manuale

permissions:
  contents: write  # Necessario per salvare il file aggiornato

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Esegui filtro playlist
        run: python filter_playlist.py

      - name: Commit e push se ci sono modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --staged --quiet || git commit -m "Update playlist $(date -u +%F)"
          git push
