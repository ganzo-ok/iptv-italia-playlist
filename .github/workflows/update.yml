name: Aggiorna Playlist IPTV

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 👇 NUOVO PASSAGGIO: Installa FFmpeg (che contiene ffprobe)
      - name: Installa FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Esegui filtro playlist
        run: python filter_playlist.py

      - name: Commit e push se ci sono modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --staged --quiet || git commit -m "Update playlist $(date -u +%F)"
          git push
